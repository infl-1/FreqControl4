name: Build patched CapCut

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip patch
        run: unzip -o capcut_telegram_patch.zip -d patch

      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download original -p Capcut-v20_0_0.apk

      - name: Apply patch
        run: python3 patch/apply_to_apk.py Capcut-v20_0_0.apk unsigned.apk

      - name: Align and sign
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore my.jks -alias key -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Me"
          $BT/apksigner sign --ks my.jks --ks-pass pass:123456 \
            --out CapCut-patched.apk aligned.apk
          $BT/apksigner verify CapCut-patched.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-patched
          path: CapCut-patched.apk
