name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  ZIP_NAME: SpeedTool-1.1-fixed.zip   # غيّر الاسم هنا فقط (نفس اسم الملف بالضبط، بدون مسافات)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::File not found: $ZIP_NAME (تأكد أنه في جذر المستودع وبنفس الاسم)"
            exit 1
          fi
          mkdir -p proj
          unzip -q -o "$ZIP_NAME" -d proj
          S=$(find proj -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle.kts not found inside $ZIP_NAME"
            exit 1
          fi
