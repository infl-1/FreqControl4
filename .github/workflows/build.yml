
name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "اسم ملف الـ zip (اتركه فاضي لاستخدام الاسم اللي في الملف)"
        required: false

env:
  ZIP_NAME: ieie.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        env:
          INPUT_ZIP: ${{ inputs.zip_name }}
        run: |
          ZIP="${INPUT_ZIP:-$ZIP_NAME}"
          echo "Using: $ZIP"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repo root"; ls -la; exit 1
          fi
          echo "=== Contents of $ZIP ==="
          unzip -l "$ZIP" | head -40
          mkdir -p src
          unzip -o -q "$ZIP" -d src
          for i in 1 2
