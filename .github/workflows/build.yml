name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q -o SpeedTool-1.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "Project dir: $D"
          echo "PROJ_DIR=$D" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedTool-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
