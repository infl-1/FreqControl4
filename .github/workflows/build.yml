name: Build LSPosed module
on:
  push:
  workflow_dispatch:

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip module project
        run: unzip -q -o SmartCaptureLS.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build LSPosed module
        working-directory: SmartCaptureLS
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SmartCaptureLS-module
          path: SmartCaptureLS/app/build/outputs/apk/release/*.apk
