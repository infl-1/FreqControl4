name: Build APK
on:
  push:
  workflow_dispatch:

env:
  ZIP_NAME: TikSaver-v1.4.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: $ZIP_NAME not found"; ls -la; exit 1
          fi
          mkdir -p src
          unzip -o -q "$ZIP_NAME" -d src
          SET=$(find src -name 'settings.gradle*' | head -1)
          if [ -z "$SET" ]; then
            echo "ERROR: no settings.gradle found"; find src -maxdepth 3; exit 1
          fi
          echo "PROJ=$(dirname "$SET")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        shell: bash
        working-directory: ${{ env.PROJ }}
        run: grep -E "^e: |error:|What went wrong" -A6 build.log | head -80 || true

      - uses: actions/upload-artifact@v4
        with:
          name: TikSaver-debug
          path: ${{ env.PROJ }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
