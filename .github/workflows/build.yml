name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "اسم ملف الـ zip (اتركه فاضي لاستخدام الاسم اللي في الملف)"
        required: false

env:
  ZIP_NAME: tiksaver-quality.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        env:
          INPUT_ZIP: ${{ inputs.zip_name }}
        run: |
          ZIP="${INPUT_ZIP:-$ZIP_NAME}"
          echo "Using: $ZIP"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repo root"; exit 1
          fi
          mkdir -p src
          unzip -o -q "$ZIP" -d src
          SET=$(find src -path '*/__MACOSX' -prune -o -name 'settings.gradle*' -print | head -1)
          if [ -z "$SET" ]; then
            echo "ERROR: no settings.gradle found inside $ZIP"; exit 1
          fi
          echo "PROJ=$(dirname "$SET")" >> $GITHUB_ENV

      - name: Copy QualityPicker.kt (if in repo root)
        shell: bash
        run: |
          if [ -f QualityPicker.kt ]; then
            MAIN=$(find "$PROJ" -name 'MainActivity.kt' | head -1)
            if [ -n "$MAIN" ]; then
              cp QualityPicker.kt "$(dirname "$MAIN")/"
              echo "Copied to $(dirname "$MAIN")"
            else
              echo "WARNING: MainActivity.kt not found"
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          else
            gradle a
