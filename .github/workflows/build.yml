name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="hhhh.zip"
          ls -la
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repo root"
            exit 1
          fi
          mkdir -p src
          unzip -o -q "$ZIP" -d src
          SET=$(find src -name 'settings.gradle*' | head -1)
          if [ -z "$SET" ]; then
            echo "ERROR: no settings.gradle found inside $ZIP"
            exit 1
          fi
          PROJ=$(dirname "$SET")
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedTool-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
